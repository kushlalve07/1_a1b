name: ridesync
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ridesync
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ridesync
    ports: ["5432:5432"]
    volumes:
      - ridesync_pg:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ridesync"]
      interval: 5s
      timeout: 3s
      retries: 20
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["ridesync_mongo:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      PORT: 5000
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ridesync
      PGUSER: postgres
      PGPASSWORD: ridesync
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: ridesync
      WEB_DIR: /app/web
    ports: ["5000:5000"]
    depends_on:
      postgres: {condition: service_healthy}
      mongo: {condition: service_healthy}
    restart: unless-stopped
volumes:
  ridesync_pg:
  ridesync_mongo:
